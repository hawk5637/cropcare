<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | CropCare Agritech</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        line-height: 1.6;
      }
      .card {
        background: rgba(30, 41, 59, 0.7);
        border: 1px solid rgba(51, 65, 85, 0.8);
        border-radius: 1.5rem;
        padding: 2.5rem 2rem;
        max-width: 520px;
        width: 100%;
        text-align: center;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(12px);
      }
      .icon-badge {
        width: 4.5rem;
        height: 4.5rem;
        margin: 0 auto 1.5rem;
        border-radius: 1.25rem;
        background: linear-gradient(135deg, #047857, #10b981);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);
      }
      .icon-badge svg {
        width: 2.5rem;
        height: 2.5rem;
        color: #ffffff;
      }
      .code {
        display: inline-block;
        font-size: 0.85rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #34d399;
        background: rgba(6, 95, 70, 0.4);
        border: 1px solid rgba(52, 211, 153, 0.3);
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        margin-bottom: 0.75rem;
      }
      h1 {
        font-size: 1.85rem;
        font-weight: 800;
        color: #ffffff;
        margin-bottom: 0.75rem;
        letter-spacing: -0.025em;
      }
      p {
        color: #94a3b8;
        font-size: 0.95rem;
        margin-bottom: 2rem;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        min-height: 48px;
        padding: 0.75rem 1.5rem;
        border-radius: 0.75rem;
        font-size: 0.95rem;
        font-weight: 700;
        text-decoration: none;
        transition: all 0.2s ease;
        cursor: pointer;
      }
      .btn-primary {
        background: #059669;
        color: #ffffff;
        box-shadow: 0 10px 15px -3px rgba(5, 150, 105, 0.4);
      }
      .btn-primary:hover {
        background: #10b981;
        transform: translateY(-1px);
      }
      .btn-secondary {
        background: rgba(51, 65, 85, 0.6);
        color: #cbd5e1;
        border: 1px solid rgba(71, 85, 105, 0.6);
      }
      .btn-secondary:hover {
        background: rgba(71, 85, 105, 0.8);
        color: #ffffff;
      }
      .helpline {
        margin-top: 1.5rem;
        padding-top: 1.25rem;
        border-top: 1px solid rgba(51, 65, 85, 0.6);
        font-size: 0.8rem;
        color: #64748b;
      }
      .helpline a {
        color: #34d399;
        text-decoration: none;
        font-weight: 600;
      }
      .helpline a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <div class="icon-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 20h10" />
          <path d="M10 20c0-4 1.5-6.5 4-8.5" />
          <path d="M14 20c0-4-1.5-6.5-4-8.5" />
          <path d="M12 11.5V3" />
          <path d="m8 7 4-4 4 4" />
        </svg>
      </div>

      <span class="code">Error 404</span>
      <h1>Field Not Found</h1>
      <p>
        The agricultural module or lot you are looking for has been harvested, moved, or does not exist.
      </p>

      <div class="actions">
        <a href="/" class="btn btn-primary">
          <span>Return to CropCare Dashboard</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        </a>
        <a href="tel:+9118002767227" class="btn btn-secondary">
          <span>Call Kisan Helpline (1800-276-7227)</span>
        </a>
      </div>

      <div class="helpline">
        Need assistance? Email our agronomist team at <a href="mailto:support@cropcare.ag">support@cropcare.ag</a>
      </div>
    </main>
  </body>
</html>
